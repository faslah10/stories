<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>فاصلة عشرية — قصص</title>
  <meta name="description" content="فاصلة عشرية: قراءة أسبوعية لاقتصاد السعودية بالأرقام. كل رقم له مصدر.">
  <meta name="theme-color" content="#5E35B1">
  <link rel="canonical" href="https://faslah10.github.io/stories/">
  <style>
    :root{--purple:#5E35B1;--orange:#E58606;--ink:#1a1523}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      direction:rtl;text-align:center;color:#fff;padding:8vh 6vw;
      font-family:"Tajawal","Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
      background:radial-gradient(120% 90% at 50% 0%,#6a3fc0 0%,var(--purple) 55%,#3d1f7a 100%)}
    main{max-width:34rem}
    .comma{font-size:clamp(3rem,16vw,6rem);color:var(--orange);line-height:1}
    h1{font-size:clamp(2rem,9vw,3rem);font-weight:800;margin:.2em 0 .1em}
    .tag{font-size:1rem;opacity:.85;margin-bottom:2.4em}
    .card{display:block;margin:2.2em auto 0;max-width:30rem;text-decoration:none;color:inherit;
      background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:18px;
      padding:1.4rem 1.5rem;transition:transform .15s ease,background .15s ease}
    .card:hover{transform:translateY(-3px);background:rgba(255,255,255,.16)}
    .card .kicker{display:inline-block;background:var(--orange);color:#fff;font-weight:800;
      font-size:.8rem;border-radius:999px;padding:.15em .8em;margin-bottom:.7em}
    .card h2{font-size:clamp(1.4rem,6vw,2rem);font-weight:800;margin:.1em 0}
    .card p{opacity:.9;margin:.3em 0 0}
    .foot{margin-top:2.8em;font-size:.85rem;opacity:.8}
    .foot a{color:#ffd9a8;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <div class="comma" aria-hidden="true">٫</div>
    <h1>فاصلة عشرية</h1>
    <p class="tag">قراءة أسبوعية لاقتصاد السعودية بالأرقام.</p>
    <a class="card" href="food/">
      <span class="kicker">قصة</span>
      <h2>من 120 إلى 31 ريالًا</h2>
      <p>ماذا انكمش فعلًا: الوجبة أم النقود الورقية؟</p>
    </a>
    <p class="foot"><a href="https://faslah10.substack.com">faslah10.substack.com</a> · @faslah_10</p>
  </main>
</body>
</html>
